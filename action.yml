name: 'TestGuard — Claim Verification'
description: 'Breaks your code on purpose and fails the build on every promise your tests did not notice breaking.'
author: 'Ricardo Accioly'

branding:
  icon: 'crosshair'
  color: 'red'

inputs:
  command:
    description: 'Command to run: probe, claims, baseline, brief, gate'
    required: false
    default: 'probe'
  working-directory:
    description: 'Directory whose test runner is invoked (where testguard.claims.json lives)'
    required: false
    default: '.'
  claims:
    description: 'Path to the claims file (default: <working-directory>/testguard.claims.json)'
    required: false
    default: ''
  severity:
    description: 'Gate only at or above this severity: critical, high, medium, low'
    required: false
    default: 'low'
  confirm:
    description: 'Runs per verdict (N)'
    required: false
    default: '3'
  budget:
    description: 'Wall-clock budget per test run, ms'
    required: false
    default: '120000'
  no-escalate:
    description: 'Skip re-running survivors against the whole suite'
    required: false
    default: 'false'
  allow-empty:
    description: 'probe only: explicitly skip a valid empty claims file during adoption; writes no evidence. Run gate separately.'
    required: false
    default: 'false'
  changed-ref:
    description: 'gate only: the reference the change is measured against (default: origin/<base branch> of the pull request). Check out with fetch-depth: 0 so it resolves.'
    required: false
    default: ''
  strict:
    description: 'gate only: fail a change whose files were all excluded instead of passing with a note'
    required: false
    default: 'false'
  version:
    description: 'testguard-cli version to run'
    required: false
    default: '0.18.3'
  node-version:
    description: 'Node.js version (20+)'
    required: false
    default: '22'
  runner:
    description: 'probe only: vitest | jest | playwright | python | pytest | unittest | node-test | auto. `python` picks pytest when the interpreter can import it and stdlib unittest otherwise; `pytest`/`unittest` pin that choice and fail rather than fall back.'
    required: false
    default: 'auto'
  python:
    description: 'probe only: Python interpreter for .py defenders (default: $VIRTUAL_ENV, then the project .venv/venv, then python3 on PATH). Set it when your dependencies live in a venv this workflow created.'
    required: false
    default: ''

outputs:
  evidence:
    description: 'Absolute path of the evidence file this run wrote: .testguard/evidence.json, or .testguard/evidence-provisional.json when confirm < 3. Empty when the command wrote none (gate, claims, baseline, brief, an allow-empty probe, or a probe that stopped before writing).'
    value: ${{ steps.run.outputs.evidence }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs reach the script as environment variables, never spliced into
      # its text: a `${{ }}` expression inside `run:` is pasted in before bash
      # parses it, so an input carrying `"` or `$(...)` would run as shell.
      env:
        TG_COMMAND: ${{ inputs.command }}
        TG_CLAIMS: ${{ inputs.claims }}
        TG_SEVERITY: ${{ inputs.severity }}
        TG_CONFIRM: ${{ inputs.confirm }}
        TG_BUDGET: ${{ inputs.budget }}
        TG_NO_ESCALATE: ${{ inputs.no-escalate }}
        TG_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        TG_CHANGED_REF: ${{ inputs.changed-ref }}
        TG_STRICT: ${{ inputs.strict }}
        TG_VERSION: ${{ inputs.version }}
        TG_RUNNER: ${{ inputs.runner }}
        TG_PYTHON: ${{ inputs.python }}
      run: |
        set -o pipefail
        ARGS=()
        [ -n "$TG_CLAIMS" ] && ARGS+=(--claims "$TG_CLAIMS")
        if [ "$TG_COMMAND" = "probe" ]; then
          ARGS+=(--severity "$TG_SEVERITY" --confirm "$TG_CONFIRM" --budget "$TG_BUDGET")
          [ "$TG_NO_ESCALATE" = "true" ] && ARGS+=(--no-escalate)
          [ "$TG_ALLOW_EMPTY" = "true" ] && ARGS+=(--allow-empty)
          [ "$TG_RUNNER" != "auto" ] && ARGS+=(--runner "$TG_RUNNER")
          [ -n "$TG_PYTHON" ] && ARGS+=(--python "$TG_PYTHON")
        fi
        [ "$TG_COMMAND" = "brief" ] && ARGS+=(--text)
        if [ "$TG_COMMAND" = "gate" ]; then
          REF="$TG_CHANGED_REF"
          if [ -z "$REF" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --quiet origin "$GITHUB_BASE_REF" || true
            REF="origin/${GITHUB_BASE_REF}"
          fi
          [ -n "$REF" ] && ARGS+=(--changed "$REF")
          [ "$TG_STRICT" = "true" ] && ARGS+=(--strict)
        fi
        # `evidence` names the file THIS run wrote: evidence.json for a
        # confirmed probe, evidence-provisional.json when confirm < 3, and
        # nothing for a command that writes no evidence or a probe that stopped
        # before writing. A file already there (a restored cache) is compared
        # by inode, size and timestamps before and after, so a stale copy is
        # never reported as this run's result.
        fingerprint() {
          node -e 'const fs = require("node:fs"); for (const f of [".testguard/evidence.json", ".testguard/evidence-provisional.json"]) { let s; try { s = fs.statSync(f, { bigint: true }); } catch { continue; } console.log([f, s.ino, s.size, s.mtimeNs, s.ctimeNs].join(" ")); }'
        }
        BEFORE="$(fingerprint)"
        status=0
        npx -y "testguard-cli@${TG_VERSION}" "$TG_COMMAND" . "${ARGS[@]}" || status=$?
        EVIDENCE=""
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          if ! grep -qxF -- "$line" <<<"$BEFORE"; then EVIDENCE="$(pwd)/${line%% *}"; break; fi
        done <<<"$(fingerprint)"
        echo "evidence=${EVIDENCE}" >> "$GITHUB_OUTPUT"
        exit "$status"
