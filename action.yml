name: 'TestGuard — Claim Verification'
description: 'Breaks your code on purpose and fails the build on every promise your tests did not notice breaking.'
author: 'Ricardo Accioly'

branding:
  icon: 'crosshair'
  color: 'red'

inputs:
  command:
    description: 'Command to run: probe, claims, baseline, brief, gate'
    required: false
    default: 'probe'
  working-directory:
    description: 'Directory whose test runner is invoked (where testguard.claims.json lives)'
    required: false
    default: '.'
  claims:
    description: 'Path to the claims file (default: <working-directory>/testguard.claims.json)'
    required: false
    default: ''
  severity:
    description: 'Gate only at or above this severity: critical, high, medium, low'
    required: false
    default: 'low'
  confirm:
    description: 'Runs per verdict (N)'
    required: false
    default: '3'
  budget:
    description: 'Wall-clock budget per test run, ms'
    required: false
    default: '120000'
  no-escalate:
    description: 'Skip re-running survivors against the whole suite'
    required: false
    default: 'false'
  changed-ref:
    description: 'gate only: the reference the change is measured against (default: origin/<base branch> of the pull request). Check out with fetch-depth: 0 so it resolves.'
    required: false
    default: ''
  strict:
    description: 'gate only: fail a change whose files were all excluded instead of passing with a note'
    required: false
    default: 'false'
  version:
    description: 'testguard-cli version to run'
    required: false
    default: '0.9.1'
  node-version:
    description: 'Node.js version (20+)'
    required: false
    default: '22'
  runner:
    description: 'probe only: vitest | jest | playwright | python | pytest | unittest | auto. `python` picks pytest when the interpreter can import it and stdlib unittest otherwise; `pytest`/`unittest` pin that choice and fail rather than fall back.'
    required: false
    default: 'auto'
  python:
    description: 'probe only: Python interpreter for .py defenders (default: $VIRTUAL_ENV, then the project .venv/venv, then python3 on PATH). Set it when your dependencies live in a venv this workflow created.'
    required: false
    default: ''

outputs:
  evidence:
    description: 'Path to the evidence file written by probe'
    value: ${{ steps.run.outputs.evidence }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -o pipefail
        ARGS=()
        [ -n "${{ inputs.claims }}" ] && ARGS+=(--claims "${{ inputs.claims }}")
        if [ "${{ inputs.command }}" = "probe" ]; then
          ARGS+=(--severity "${{ inputs.severity }}" --confirm "${{ inputs.confirm }}" --budget "${{ inputs.budget }}")
          [ "${{ inputs.no-escalate }}" = "true" ] && ARGS+=(--no-escalate)
          [ "${{ inputs.runner }}" != "auto" ] && ARGS+=(--runner "${{ inputs.runner }}")
          [ -n "${{ inputs.python }}" ] && ARGS+=(--python "${{ inputs.python }}")
        fi
        [ "${{ inputs.command }}" = "brief" ] && ARGS+=(--text)
        if [ "${{ inputs.command }}" = "gate" ]; then
          REF="${{ inputs.changed-ref }}"
          if [ -z "$REF" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --quiet origin "$GITHUB_BASE_REF" || true
            REF="origin/${GITHUB_BASE_REF}"
          fi
          [ -n "$REF" ] && ARGS+=(--changed "$REF")
          [ "${{ inputs.strict }}" = "true" ] && ARGS+=(--strict)
        fi
        echo "evidence=$(pwd)/.testguard/evidence.json" >> "$GITHUB_OUTPUT"
        npx -y "testguard-cli@${{ inputs.version }}" "${{ inputs.command }}" . "${ARGS[@]}"
