name: TestGuard CI

on:
  workflow_dispatch: # manual recovery for pushes that don't auto-trigger (e.g. release PRs opened by GITHUB_TOKEN)
  push:
    branches: [main]
    tags: ['v*'] # publish-check below runs on tags only
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * *' # nightly: the full self-probe of main, which a scoped pull-request probe does not replace

permissions:
  contents: read

# The release branch is dispatched AND gets a pull_request run on the same
# commit. Serializing those two runs lets the second find the first's release
# evidence and reuse it, so a release tree is probed in full once. Every other
# run has a group of its own and queues behind nothing.
concurrency:
  group: ci-${{ startsWith(github.head_ref || github.ref_name, 'release/') && (github.event.pull_request.head.sha || github.sha) || github.run_id }}
  cancel-in-progress: false

jobs:
  # The unit suite is SHARDED (`vitest run --shard=i/3`) inside every Node leg,
  # because one job kept hitting the 300 s wall-clock budget as the suite grew
  # (three feature pull requests were blocked by it). Each shard has its own
  # budget, set about 30% above that shard's slowest leg measured in CI (first
  # run, Node 20/22/24: shard 1 45-64 s, shard 2 56-84 s, shard 3 94-149 s, over two runs). A shard that
  # runs no test file fails. `npm test` is unchanged for local use.
  unit:
    name: unit (${{ matrix.node-version }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor (node:util.parseArgs). 24 ships npm 11 — keep it so
        # `npm ci` exercises the npm that treats some config as fatal where
        # npm 10 is silent. Do not drop 24.
        node-version: [20, 22, 24]
        shard: [1, 2, 3]
        include:
          - shard: 1
            budget-ms: 85000
          - shard: 2
            budget-ms: 110000
          - shard: 3
            budget-ms: 195000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tests build git worktrees from HEAD

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      # The TypeScript fixture carries its own typescript and vitest (never the
      # tool's dependencies). The suites that use it fail loudly without this.
      - name: Install the TypeScript fixture
        run: npm ci --prefix fixtures/known-answer-typescript

      # ── This shard's tests with a RUNTIME BUDGET. A test that walks the wrong
      #    tree or probes far more than it should still passes — it just takes
      #    forever. Only a duration gate catches that class. ──
      - name: Run this shard's tests (with runtime budget)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TEST_BUDGET_MS: ${{ matrix.budget-ms }}
        run: |
          START=$(date +%s%3N)
          npx vitest run --shard="$SHARD/3" --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/shard.json"
          DURATION=$(( $(date +%s%3N) - START ))
          echo "Shard $SHARD/3 duration: ${DURATION}ms (budget: ${TEST_BUDGET_MS}ms)"
          # A shard that ran no test file is a lost slice, never a pass.
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!(r.testResults?.length>0)){console.error('::error::shard '+process.env.SHARD+'/3 ran zero test files');process.exit(1)} console.log('shard '+process.env.SHARD+'/3 ran '+r.testResults.length+' test files')" "$RUNNER_TEMP/shard.json"
          if [ "$DURATION" -gt "$TEST_BUDGET_MS" ]; then
            echo "::error::Shard $SHARD/3 took ${DURATION}ms, over the ${TEST_BUDGET_MS}ms budget — something is probing far more than it should."
            exit 1
          fi

  # Everything the old single job did besides the unit suite, once per Node
  # version: syntax check, install smoke, the dogfood runs, DocGuard, the
  # claims checks.
  static:
    name: static (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # probe builds a git worktree from HEAD; the self-probe below needs history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      # The TypeScript fixture carries its own typescript and vitest (never the
      # tool's dependencies). The suites that use it fail loudly without this.
      - name: Install the TypeScript fixture
        run: npm ci --prefix fixtures/known-answer-typescript

      # ── Syntax-check EVERY source, not just what the entry point eagerly
      #    imports; a lazily loaded module's parse error would otherwise slip. ──
      - name: Syntax-check all sources
        run: find cli src spec -name '*.mjs' -print0 | xargs -0 -n1 node --check

      # ── Install-from-tarball smoke: the package must run as INSTALLED, with
      #    production dependencies only. 0.1.0 shipped unrunnable because the
      #    schema validator's dependency was a devDependency; the suite, which
      #    runs from the checkout, could not see it. ──
      - name: Install smoke (pack → install --omit=dev → run)
        run: npm run test:install

      - name: Python wrapper imports (PyPI surface)
        run: python3 -c "import testguard_cli.wrapper; print('testguard_cli.wrapper OK')"

      # ── Dogfood: the real binary against the known-answer fixture, as a
      #    user would run it (the suite drives main() in-process). ──
      - name: CLI version
        run: node cli/testguard.mjs --version

      - name: claims — fixture lists cleanly, no drift
        run: node cli/testguard.mjs claims fixtures/known-answer

      - name: probe → baseline → probe → brief on the fixture (through the bin)
        shell: bash
        run: |
          set -o pipefail
          S=$(mktemp -d)
          cp -R fixtures/known-answer/. "$S/"
          rm -rf "$S/node_modules" "$S/.flake-counter" "$S/.testguard"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$S/node_modules"
          git -C "$S" init -q
          git -C "$S" -c user.email=ci@example.invalid -c user.name=ci add -A
          git -C "$S" -c user.email=ci@example.invalid -c user.name=ci commit -qm fixture
          B="$GITHUB_WORKSPACE/cli/testguard.mjs"
          status=0; node "$B" probe "$S" --budget 60000 --quiet || status=$?
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1 (unproven claims), got $status"; exit 1; }
          node "$B" baseline "$S"
          status=0; node "$B" probe "$S" --budget 60000 --quiet || status=$?
          [ "$status" -eq 0 ] || { echo "::error::expected exit 0 after baseline, got $status"; exit 1; }
          node "$B" brief "$S" --text | head -12
          # every verdict must appear exactly once per expected.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const ev = JSON.parse(readFileSync('$S/.testguard/evidence.json','utf8'));
            const exp = JSON.parse(readFileSync('fixtures/known-answer/expected.json','utf8')).expected;
            const bad = ev.records.filter(r => exp[r.claim.id+'/'+r.subject.id].verdict !== r.verdict);
            if (bad.length) { console.error('MISMATCH', bad.map(r => r.claim.id+'/'+r.subject.id+':'+r.verdict)); process.exit(1); }
            console.log('fixture verdicts match expected.json:', ev.records.length);
          "

      - name: probe the jest fixture (through the bin, --runner jest)
        shell: bash
        run: |
          S=$(mktemp -d)
          cp -R fixtures/known-answer-jest/. "$S/"
          rm -rf "$S/node_modules" "$S/.flake-counter" "$S/.testguard"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$S/node_modules"
          git -C "$S" init -q && git -C "$S" -c user.email=ci@example.invalid -c user.name=ci add -A && git -C "$S" -c user.email=ci@example.invalid -c user.name=ci commit -qm fixture
          status=0; node cli/testguard.mjs probe "$S" --runner jest --budget 60000 --quiet --no-escalate || status=$?
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1, got $status"; exit 1; }
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const ev = JSON.parse(readFileSync('$S/.testguard/evidence.json','utf8'));
            const exp = JSON.parse(readFileSync('fixtures/known-answer-jest/expected.json','utf8')).expected;
            if (ev.run.runner.name !== 'jest') { console.error('runner was', ev.run.runner.name); process.exit(1); }
            const bad = ev.records.filter(r => exp[r.claim.id+'/'+r.subject.id].verdict !== r.verdict);
            if (bad.length) { console.error('MISMATCH', bad.map(r => r.claim.id+'/'+r.subject.id+':'+r.verdict)); process.exit(1); }
            console.log('jest fixture verdicts match expected.json:', ev.records.length);
          "

      - name: probe the native Node fixture without test dependencies
        run: node .github/scripts/check-node-fixture.mjs

      # ── The MCP server, driven as a client would: handshake, list, call.
      #    A harness-independent surface is only worth having if it actually
      #    speaks the protocol from a cold start. ──
      - name: mcp — handshake, tools/list, tools/call over stdio
        shell: bash
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"testguard_status","arguments":{"dir":"."}}}' \
            | node cli/testguard.mjs mcp > "$RUNNER_TEMP/mcp.jsonl"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const msgs = readFileSync(process.env.RUNNER_TEMP + '/mcp.jsonl', 'utf8').trim().split('\n').map((l) => JSON.parse(l));
            if (msgs.length !== 3) { console.error('expected 3 replies (the notification is never answered), got', msgs.length); process.exit(1); }
            const [init, list, call] = msgs;
            if (!init.result.protocolVersion) { console.error('no protocolVersion'); process.exit(1); }
            if (list.result.tools.length !== 5) { console.error('expected 5 tools, got', list.result.tools.length); process.exit(1); }
            if (!list.result.tools.every((t) => t.annotations.readOnlyHint)) { console.error('a tool is not marked read-only'); process.exit(1); }
            if (call.result.isError) { console.error('status call failed:', call.result.content[0].text); process.exit(1); }
            if (!call.result.structuredContent.next.action) { console.error('status carried no next action'); process.exit(1); }
            console.log('mcp:', list.result.tools.map((t) => t.name).join(', '), '→ state', call.result.structuredContent.state);
          "

      # ── Documentation is canon: DocGuard validates this repository against
      #    docs-canonical/. This is the authoritative check — a machine-local
      #    .git/hooks file is neither shared with contributors nor reviewable,
      #    so CI is where doc drift is actually caught. `guard` exits 2 for
      #    warnings, which we surface without failing; errors fail the build. ──
      - name: DocGuard — documentation matches the code
        run: |
          # Capture the exit code explicitly. A pipeline under the default
          # `bash -e` aborts the step before any branch on its status can run,
          # and `|| code=$?` is the one form errexit does not trip on.
          code=0
          npx -y docguard-cli@0.47.0 guard > "$RUNNER_TEMP/docguard-guard.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/docguard-guard.txt"
          if [ "$code" -eq 2 ]; then
            echo "::warning::DocGuard reported warnings (exit 2); see the output above."
          elif [ "$code" -ne 0 ]; then
            echo "::error::DocGuard guard failed (exit $code) — documentation contradicts the code."
            exit 1
          fi

      - name: DocGuard — maturity score (reported, not gated)
        if: always()
        run: npx -y docguard-cli@0.47.0 score || true

      # ── Every change needs a claim: the gate runs on this repository's own
      #    pull requests. A new source file without a claim (or an excusing
      #    ignore entry with a reason) turns the PR red. ──
      # A claim that disappeared is invisible to every other check: `probe`
      # verifies what is there, `gate` sees the file covered by another claim.
      # Removal is allowed; it is never silent.
      - name: claims — no claim or fault removed without a reason
        if: github.event_name == 'pull_request'
        run: node cli/testguard.mjs claims . --since "origin/${{ github.base_ref }}"

      - name: gate — every changed source file carries a claim
        if: github.event_name == 'pull_request'
        run: node cli/testguard.mjs gate . --changed "origin/${{ github.base_ref }}"

      # Exact anchors and parseable replacements are knowable without a test
      # runner. Fail here instead of spending the long self-probe merely to
      # discover that a fault could never be applied.
      - name: claims — fault anchors and replacements are valid
        if: matrix.node-version == 22
        run: node cli/testguard.mjs claims . --check-anchors


  # The required checks. `checks (22)`, `test (20)` and `test (24)` are the
  # gather for one Node version: red unless EVERY unit shard and the static job
  # of that version succeeded (read from the run's job list, so a Node 24 shard
  # never turns `test (20)` red). `test (22)`, the last job below, gates on these.
  test:
    # The Node 22 leg is named `checks (22)`: the required check `test (22)` is the
    # job at the end of this file that gathers it together with the sharded self-probe.
    name: ${{ matrix.node-version == 22 && 'checks (22)' || format('test ({0})', matrix.node-version) }}
    needs: [unit, static]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # this run's job list
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Every shard and check of this Node version must have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ matrix.node-version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | [.name, .conclusion] | @tsv')
          for want in "unit ($NODE, 1/3)" "unit ($NODE, 2/3)" "unit ($NODE, 3/3)" "static ($NODE)"; do
            got=$(printf '%s\n' "$jobs" | awk -F'\t' -v n="$want" '$1 == n { print $2 }')
            [ -n "$got" ] || fail "$want did not run"
            [ "$got" = success ] || fail "$want: $got"
            echo "$want: success"
          done

  # ── Self-verification: TestGuard is governed by the standard it defines.
  #    testguard.claims.json states invariants of the tool itself; every
  #    fault must be killed by the tool's own tests.
  #
  #    FULL (every fault) on pushes to main, the nightly schedule, manual
  #    dispatches, release branches, and any pull request that touches what
  #    can change every verdict (self-probe-scope.mjs lists it and prints
  #    why). The full probe is SHARDED across jobs and merged back, because a
  #    change under src/probe reaches most claims and one job took 30 minutes.
  #    Every other pull request runs SCOPED: `probe --changed`, only the claims
  #    the change can reach, plus the claims whose entry in the claims file
  #    changed. A scoped run does NOT prove the claims it left out; the full run
  #    on main after the merge, the nightly run and the release do.
  #
  #    The required check `test (22)` is the last job here: it is red when the
  #    unit legs, the scope decision, or the probe pipeline that applies is.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the release branch's earlier evidence; main's evidence for balancing
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      claim_ids: ${{ steps.scope.outputs.claim_ids }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      shards: ${{ steps.plan.outputs.shards }}
      indexes: ${{ steps.plan.outputs.indexes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Decide how much of its own claims the self-probe measures
        id: scope
        # Branch names are attacker-controlled on a fork pull request: they reach
        # the script through the environment, never spliced into the shell text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/self-probe-scope.mjs --event "$EVENT_NAME" --head-ref "$HEAD_REF" --ref-name "$REF_NAME" --base "origin/$BASE_REF"

      # A release tree is probed in full ONCE (release.yml verifies the artifact
      # instead of probing again). The release branch's two runs share a commit
      # and are serialized, so the second finds the first's evidence here.
      - name: Release branch — is this tree already probed in full?
        id: reuse
        if: steps.scope.outputs.mode == 'full' && startsWith(github.head_ref || github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          VERSION=$(node -p "require('./package.json').version")
          if node .github/scripts/release-evidence.mjs verify --tree "$TREE" --version "$VERSION" --repo "$GITHUB_REPOSITORY" --miss-is-notice; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tree $TREE already has a clean full probe for the release; not probing it again."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "no usable earlier probe of tree $TREE; probing in full."
          fi

      # One partition for every shard, computed here once. Balanced by what each
      # claim cost in the last full run on main when that evidence can be fetched,
      # else by fault count.
      - name: Plan the shards of the full probe
        id: plan
        if: steps.scope.outputs.mode == 'full' && steps.reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .testguard/weights
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=testguard-evidence-main&per_page=1" --jq '.artifacts[0] | select(.expired == false) | .id' 2>/dev/null || true)
          if [ -n "$ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > .testguard/weights/a.zip 2>/dev/null && unzip -o -q .testguard/weights/a.zip -d .testguard/weights || echo "::notice::main's evidence could not be fetched; balancing by fault count"
          fi
          node .github/scripts/shard-probe.mjs plan --weights-from .testguard/weights/ci-self-evidence.json

  selfprobe:
    name: selfprobe (shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.mode == 'full' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.indexes) }} # one per slice of the plan (sharded.shards in testguard.cost-budget.json); shard-probe.mjs merge fails if one is missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix fixtures/known-answer-typescript
      # Each shard times the reference workload before and after its own probe,
      # on its own runner (#255): the cost gate normalizes each shard by ITS speed.
      - name: Time the reference workload before the probe
        run: node .github/scripts/measure-reference.mjs --out .testguard/reference-before.json
      # Always from scratch. A verdict reused from an earlier run carries the
      # duration it had on THAT runner, which the gate then normalizes by THIS
      # runner's speed (the gate flags it low-confidence), so reuse made the
      # per-claim ceiling depend on which runner the last run happened to get.
      - name: probe this shard's claims
        env:
          SHARD_CLAIMS: ${{ fromJSON(needs.scope.outputs.shards)[matrix.shard] }}
        run: node cli/testguard.mjs probe . --claim "$SHARD_CLAIMS" --budget 180000 --no-escalate --cost --no-reuse --out .testguard/ci-self-evidence.json
      - name: Time the reference workload after the probe
        if: always()
        run: node .github/scripts/measure-reference.mjs --out .testguard/reference-after.json
      - name: Collect this shard's evidence and its reference timings
        if: always()
        run: |
          mkdir -p .testguard/shard-out
          cp .testguard/ci-self-evidence.json .testguard/shard-out/evidence.json || true
          cp .testguard/reference-before.json .testguard/reference-after.json .testguard/shard-out/ || true
      - name: Upload this shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfprobe-shard-${{ matrix.shard }}
          path: .testguard/shard-out
          if-no-files-found: warn
          retention-days: 7

  selfprobe-scoped:
    needs: scope
    if: needs.scope.outputs.mode == 'scoped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix fixtures/known-answer-typescript
      - name: Time the reference workload before the probe
        run: node .github/scripts/measure-reference.mjs --out .testguard/reference-before.json
      - name: probe TestGuard's own claims — only what this pull request can affect
        run: node cli/testguard.mjs probe . --changed "origin/${{ github.base_ref }}" --budget 180000 --no-escalate --cost --out .testguard/ci-self-evidence.json
      # The claims whose entry in the claims file changed (parsed, not diffed) are
      # probed whether or not the change reaches them through a file.
      - name: probe the claims whose entry changed in the claims file
        if: needs.scope.outputs.claim_ids != ''
        env:
          CLAIM_IDS: ${{ needs.scope.outputs.claim_ids }}
        run: node cli/testguard.mjs probe . --claim "$CLAIM_IDS" --budget 180000 --no-escalate --cost --out .testguard/ci-self-evidence-claims.json
      - name: Time the reference workload after the probe
        if: always()
        run: node .github/scripts/measure-reference.mjs --out .testguard/reference-after.json
      # The ceilings describe a full probe; a scoped run reports what it cost.
      - name: Cost of the scoped run (reported, not gated)
        if: always()
        run: node .github/scripts/check-cost-budget.mjs .testguard/ci-self-evidence.json --reference-before .testguard/reference-before.json --reference-after .testguard/reference-after.json --report-only
      - name: Upload self-probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testguard-self-evidence
          path: .testguard/ci-self-evidence*.json
          if-no-files-found: warn

  # The required check. Named `test (22)` so branch protection keeps requiring
  # exactly what it did, and it now stands for: the unit legs, the scope
  # decision, and the probe pipeline that applied (merged shards, or the scoped
  # run, or nothing because this release tree was already probed).
  selfprobe-gate:
    name: test (22)
    needs: [scope, test, selfprobe, selfprobe-scoped]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # downloads this run's shard artifacts
    env:
      MODE: ${{ needs.scope.outputs.mode }}
      REUSE: ${{ needs.scope.outputs.reuse }}
    steps:
      - name: Every job this one stands for must have succeeded
        env:
          R_TEST: ${{ needs.test.result }}
          R_SCOPE: ${{ needs.scope.result }}
          R_SHARDS: ${{ needs.selfprobe.result }}
          R_SCOPED: ${{ needs.selfprobe-scoped.result }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$R_SCOPE" = success ] || fail "the scope decision: $R_SCOPE"
          [ "$R_TEST" = success ] || fail "the unit legs (Node 20, 22, 24): $R_TEST"
          if [ "$MODE" = full ] && [ "$REUSE" != true ]; then [ "$R_SHARDS" = success ] || fail "the sharded self-probe: $R_SHARDS"; fi
          if [ "$MODE" = scoped ]; then [ "$R_SCOPED" = success ] || fail "the scoped self-probe: $R_SCOPED"; fi
          echo "mode $MODE (reuse: ${REUSE:-n/a}): every job this check stands for succeeded"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.MODE == 'full' && env.REUSE != 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.MODE == 'full' && env.REUSE != 'true'
        with:
          node-version: 22
      - name: Install (the merge writes the evidence through the spec validator)
        if: env.MODE == 'full' && env.REUSE != 'true'
        run: npm ci --omit=dev
      - name: Collect the shards
        if: env.MODE == 'full' && env.REUSE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir shards
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'selfprobe-shard-*' --dir shards
      # Every fault of every claim exactly once, or the job fails: a shard that
      # lost a claim would otherwise read as a smaller, passing probe.
      - name: Merge the shards into one evidence document
        if: env.MODE == 'full' && env.REUSE != 'true'
        run: node .github/scripts/shard-probe.mjs merge --dir shards --out .testguard/ci-self-evidence.json
      # The ceiling is on the SUM of the shards' normalized compute; the slowest
      # shard is printed beside it.
      - name: The gate must stay inside its cost budget
        if: always() && env.MODE == 'full' && env.REUSE != 'true'
        run: node .github/scripts/check-shard-cost.mjs shards
      - name: Release branch — package the full probe, keyed by the tree hash
        id: release_evidence
        if: env.MODE == 'full' && env.REUSE == 'false' && startsWith(github.head_ref || github.ref_name, 'release/')
        run: |
          node .github/scripts/release-evidence.mjs write --evidence .testguard/ci-self-evidence.json --out-dir "$RUNNER_TEMP/release-evidence"
          echo "name=$(node .github/scripts/release-evidence.mjs name --tree "$(git rev-parse 'HEAD^{tree}')")" >> "$GITHUB_OUTPUT"
      - name: Release branch — upload the release evidence
        if: steps.release_evidence.outputs.name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release_evidence.outputs.name }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 30
      # A stable, branch-named artifact so a developer can fetch the evidence CI
      # produced without knowing a run id, and the next run can balance by it.
      # Only a FULL run is the branch's evidence: a scoped one is partial.
      - name: Upload evidence under a stable, branch-named artifact
        if: always() && github.event_name == 'push' && env.MODE == 'full' && env.REUSE != 'true' && hashFiles('.testguard/ci-self-evidence.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testguard-evidence-${{ github.ref_name }}
          path: .testguard/ci-self-evidence.json
          if-no-files-found: warn
      - name: Upload self-probe evidence
        if: always() && env.MODE == 'full' && env.REUSE != 'true' && hashFiles('.testguard/ci-self-evidence.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testguard-self-evidence
          path: .testguard/ci-self-evidence.json
          if-no-files-found: warn

  native-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --omit=dev
      # Also the speed check for --fault-workers (#237): base and head probe one
      # CPU-bound project on THIS runner in interleaved rounds, and the medians
      # are compared as ratios (head serial vs base; head fan-out vs base), so a
      # slow or noisy runner moves every strategy alike and cannot fail it alone.
      - name: Matched native probes and the fan-out speed ratio against the exact base commit
        env:
          BEFORE_REF: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/benchmark-node-direct.mjs --before-ref "$BEFORE_REF" --out "$RUNNER_TEMP/native-performance"
      - name: Retain timings, worker receipts and every N=3 proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-performance-${{ matrix.node-version }}
          path: ${{ runner.temp }}/native-performance
          if-no-files-found: error

  native-node-floor:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.0.0'
      - name: Install production dependencies only
        run: npm ci --omit=dev
      - name: Verify the native Node floor against the independent oracle
        run: node .github/scripts/check-node-fixture.mjs

  # ── Python: two engines, one oracle. The stdlib leg runs FIRST and with no
  #    pip install of any kind, because "a project with no test dependencies
  #    still probes" is a claim about the tool and the only way to keep it true
  #    is to prove it in an environment that has none. The pytest leg then
  #    installs pytest into a venv and must reach the SAME sixteen verdicts
  #    through a different report shape. ──
  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (tool only)
        run: npm ci

      # A bare virtualenv, not the system interpreter: the claim under test is
      # "a project whose test dependencies are the standard library still
      # probes", and asserting that the runner image happens to lack pytest
      # would make this job fail for a reason that has nothing to do with the
      # product the day that image changes. Guarantee the condition instead.
      - name: The stdlib engine must need nothing installed
        shell: bash
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/bare"
          if "$RUNNER_TEMP/bare/bin/python" -c 'import pytest' 2>/dev/null; then
            echo "::error::the bare venv can import pytest; it is not bare and this leg proves nothing"
            exit 1
          fi
          TESTGUARD_PYTHON="$RUNNER_TEMP/bare/bin/python" \
            npx vitest run test/runner-python.test.mjs test/pyimports.test.mjs test/scaffold.python.test.mjs test/probe.python.test.mjs

      - name: probe the Python fixture through the bin, stdlib engine
        shell: bash
        run: |
          set -o pipefail
          S=$(mktemp -d)
          cp -R fixtures/known-answer-python/. "$S/"
          rm -rf "$S/.flake-counter" "$S/.testguard" "$S/.pytest_cache"
          find "$S" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          git -C "$S" init -q
          git -C "$S" -c user.email=ci@example.invalid -c user.name=ci add -A
          git -C "$S" -c user.email=ci@example.invalid -c user.name=ci commit -qm fixture
          status=0; node cli/testguard.mjs probe "$S" --budget 20000 --quiet --no-escalate --python "$RUNNER_TEMP/bare/bin/python" || status=$?
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1, got $status"; exit 1; }
          node .github/scripts/check-python-fixture.mjs "$S/.testguard/evidence.json" unittest

      - name: install pytest into a venv, and reach the same verdicts through it
        shell: bash
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install -q pytest
          S=$(mktemp -d)
          cp -R fixtures/known-answer-python/. "$S/"
          rm -rf "$S/.flake-counter" "$S/.testguard" "$S/.pytest_cache"
          find "$S" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          git -C "$S" init -q
          git -C "$S" -c user.email=ci@example.invalid -c user.name=ci add -A
          git -C "$S" -c user.email=ci@example.invalid -c user.name=ci commit -qm fixture
          status=0; node cli/testguard.mjs probe "$S" --budget 20000 --quiet --no-escalate \
            --runner pytest --python "$RUNNER_TEMP/pyenv/bin/python" || status=$?
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1, got $status"; exit 1; }
          node .github/scripts/check-python-fixture.mjs "$S/.testguard/evidence.json" pytest

      - name: the acceptance suite again, now against an interpreter that HAS pytest
        shell: bash
        run: |
          TESTGUARD_PYTHON="$RUNNER_TEMP/pyenv/bin/python" npx vitest run test/probe.python.test.mjs

  # ── Playwright: the per-file runner is proven against its own browserless
  #    fixture, whose dependencies live in the fixture (never in the tool's
  #    package.json). Installed and run here only. ──
  playwright:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/known-answer-playwright/package-lock.json
      - name: Install (tool + fixture)
        run: |
          npm ci
          npm ci --prefix fixtures/known-answer-playwright
          npm ci --prefix fixtures/known-answer-typescript
      - name: Write boundary — every runner, read-only and writable node_modules
        run: TESTGUARD_WRITE_BOUNDARY_FULL=1 npx vitest run test/write-boundary.acceptance.test.mjs
      - name: Playwright adapter units + mixed-defender acceptance
        run: npx vitest run test/runner-playwright.test.mjs test/probe.playwright.test.mjs
      - name: probe the playwright fixture through the bin (mixed defenders, auto runner)
        shell: bash
        run: |
          set -o pipefail
          S=$(mktemp -d)
          cp -R fixtures/known-answer-playwright/. "$S/"
          rm -rf "$S/node_modules" "$S/.flake-counter" "$S/.testguard" "$S/test-results"
          ln -s "$GITHUB_WORKSPACE/fixtures/known-answer-playwright/node_modules" "$S/node_modules"
          git -C "$S" init -q && git -C "$S" -c user.email=ci@example.invalid -c user.name=ci add -A && git -C "$S" -c user.email=ci@example.invalid -c user.name=ci commit -qm fixture
          status=0; node cli/testguard.mjs probe "$S" --budget 60000 --quiet --no-escalate || status=$?
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1, got $status"; exit 1; }
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const ev = JSON.parse(readFileSync('$S/.testguard/evidence.json','utf8'));
            const exp = JSON.parse(readFileSync('fixtures/known-answer-playwright/expected.json','utf8')).expected;
            const names = (ev.run.runners ?? []).map(r => r.name).sort().join(',');
            if (names !== 'playwright,vitest') { console.error('runners were', names); process.exit(1); }
            const bad = ev.records.filter(r => exp[r.claim.id+'/'+r.subject.id].verdict !== r.verdict);
            if (bad.length) { console.error('MISMATCH', bad.map(r => r.claim.id+'/'+r.subject.id+':'+r.verdict)); process.exit(1); }
            console.log('playwright fixture verdicts match expected.json:', ev.records.length);
          "

  # ── Hermeticity: the suite must not depend on the machine's git config.
  #    Runners carry none, so a fixture that commits through a global
  #    core.hooksPath or commit.gpgsign is green here and red on every
  #    machine that has one — 142 tests were. On a sibling project that gap
  #    made a coding agent re-propose the same "fix" 27 times, because CI
  #    could never reproduce what its sandbox saw. Fixtures pin their own
  #    git options (test/helpers/git.mjs); the product code under test
  #    still meets this config, which is the point of running it. ──
  hermeticity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          npm ci --prefix fixtures/known-answer-typescript
      - name: Manufacture a hostile global git config
        shell: bash
        run: |
          H="$RUNNER_TEMP/hostile"
          mkdir -p "$H/hooks"
          for hook in pre-commit prepare-commit-msg commit-msg post-commit pre-push post-checkout; do
            printf '#!/bin/sh\necho "hostile %s hook fired" >&2\nexit 1\n' "$hook" > "$H/hooks/$hook"
            chmod +x "$H/hooks/$hook"
          done
          printf '[core]\n\thooksPath = %s\n[commit]\n\tgpgsign = true\n[tag]\n\tgpgsign = true\n[gpg]\n\tprogram = /usr/bin/false\n[init]\n\tdefaultBranch = trunk\n' "$H/hooks" > "$H/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$H/gitconfig" >> "$GITHUB_ENV"
      # A hostile config that git ignores proves nothing; fail before the suite
      # if an unpinned commit would still succeed under it.
      - name: Prove the config is hostile
        shell: bash
        run: |
          R="$(mktemp -d)"
          git -C "$R" init -q
          if git -C "$R" -c user.name=probe -c user.email=probe@example.invalid commit -q --allow-empty -m probe 2>/dev/null; then
            echo "::error::an unpinned commit succeeded; the hostile config is not in effect"
            exit 1
          fi
      - name: Run tests under the hostile config
        run: npm test

  # ── npm publish dry-run on tags ──
  publish-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm publish --dry-run
