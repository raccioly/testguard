name: Scheduled Release

# Weekly: if anything releasable merged since the last tag, bump the patch
# version, write the CHANGELOG entry, sync every version surface, verify the
# tree is green, and open a release PR with auto-merge armed. Once merged, the
# hourly sweep in release.yml tags and publishes.
#
# GITHUB_TOKEN-created PRs do not trigger `pull_request` workflows, so nothing
# would ever start the required checks and auto-merge would wait forever. This
# workflow therefore dispatches ci.yml on the release branch itself:
# `workflow_dispatch` is the one event GITHUB_TOKEN may trigger.
#
# That is not the whole story, and v0.9.0 proved it. The `pull_request` runs
# the PR creates anyway are held at `action_required`, because the repository
# requires approval from first-time contributors and `github-actions[bot]` is
# permanently one. Held runs keep check suites QUEUED on the head sha, so the
# rollup never becomes terminal and auto-merge waits — with every required
# check already green. This workflow now approves those runs itself, which
# GITHUB_TOKEN is permitted to do. Only then does no human step remain.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check for unreleased changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --tags origin "refs/tags/v$CURRENT" | grep -q "refs/tags/v$CURRENT$"; then
            echo "v$CURRENT is not published — dispatching the idempotent release."
            gh workflow run release.yml --ref main
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$LAST_TAG" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline | grep -viE '^[0-9a-f]+ (release|chore\(release\)):' || true)
          COUNT=$(echo "$COMMITS" | grep -c . || true)
          echo "Last tag: $LAST_TAG — releasable commits since: $COUNT"
          echo "$COMMITS"
          if [ "$COUNT" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
            echo "$COMMITS" > /tmp/commits.txt
          fi

      - name: Bump version and write changelog
        if: steps.check.outputs.changed == 'true'
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          OLD="${{ steps.check.outputs.current }}"
          NEW=$(node -e "const [a,b,c]='$OLD'.split('.').map(Number); console.log('$BUMP'==='minor' ? \`\${a}.\${b+1}.0\` : \`\${a}.\${b}.\${c+1}\`)")
          echo "Bumping $OLD → $NEW"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only --ignore-scripts
          {
            echo "## [$NEW] - $(date -u +%Y-%m-%d)"; echo
            echo "Automated weekly release — everything merged since \`${{ steps.check.outputs.last_tag }}\`."; echo
            echo "### Changed"; echo
            sed -E 's/^[0-9a-f]+ /- /' /tmp/commits.txt; echo
          } > /tmp/entry.md
          awk '/^## \[Unreleased\]/ { print; print ""; while ((getline line < "/tmp/entry.md") > 0) print line; next } { print }' CHANGELOG.md > /tmp/CHANGELOG.new && mv /tmp/CHANGELOG.new CHANGELOG.md
          node .github/scripts/sync-release-version.mjs
          # The sync just wrote the brief's masthead; the committed PDF still
          # shows the old one. --require-chrome because a skipped render here
          # would ship an HTML and a PDF that disagree, silently and at exit 0.
          # ubuntu-latest carries /usr/bin/google-chrome.
          node .github/scripts/build-one-pager.mjs --require-chrome
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"

      - name: Verify the tree is still green
        if: steps.check.outputs.changed == 'true'
        # --include-dirty is REQUIRED here, not a convenience. The step above
        # bumped the version and synced every surface, and those writes are
        # still uncommitted: the commit happens later, in the PR step. One of
        # those surfaces, packaging/gitlab/testguard.gitlab-ci.yml, is the
        # fault target of TG-GITLAB-PROBE-EXIT-PRESERVED, so the default
        # worktree mode refuses to run at all — "1 defender/target file has
        # uncommitted changes … worktree mode probes HEAD, so those changes
        # would be silently ignored" (exit 2). That refusal is correct; the
        # answer is to probe the tree we are about to release, which is what
        # --include-dirty does (it snapshots the working tree into a scratch
        # commit). --ignore-dirty would probe HEAD and quietly verify the
        # PREVIOUS version instead, which is the optimistic reading this
        # project does not take.
        run: |
          npm ci
          npm test
          node cli/testguard.mjs probe . --budget 180000 --quiet --include-dirty --out "$RUNNER_TEMP/self.json"

      - name: Open release PR with auto-merge armed
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${NEW_VERSION}"
          # Only release surfaces may change in a release PR. The list is
          # DERIVED from the sync script, never retyped here: when the GitLab
          # template became a surface it was left out of the hand-written list,
          # so the first release to reach this guard would have been rejected
          # for writing a file the release is supposed to write. The four
          # extras are the ones the bump step writes directly: three from the
          # bump itself, plus the brief's PDF, which is rendered from a surface
          # rather than being one.
          ALLOWED=$(node .github/scripts/sync-release-version.mjs --list-surfaces; printf 'package.json\npackage-lock.json\nCHANGELOG.md\ndocs/testguard-explained.pdf\n')
          echo "Release surfaces allowed in this diff:"; printf '%s\n' "$ALLOWED" | sed 's/^/  /'
          CHANGED=$(git diff --name-only HEAD --)
          for f in $CHANGED; do
            printf '%s\n' "$ALLOWED" | grep -qxF "$f" || { echo "::error::unexpected file in release diff: $f"; exit 1; }
          done
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::branch $BRANCH already exists; refusing to overwrite"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "release: v${NEW_VERSION} — automated weekly batch"
          git push origin "$BRANCH"
          printf 'Automated weekly release. Version bump + CHANGELOG entry + synced version surfaces. Merging tags and publishes to npm and PyPI via release.yml.\n\nTwo things a GITHUB_TOKEN PR needs done for it, both handled by this workflow: it raises no `pull_request` event, so ci.yml was dispatched on `%s` itself; and the `pull_request` runs it does create are held at `action_required` (github-actions[bot] is permanently a first-time contributor), so those were approved too. Auto-merge is armed and completes once the three Node legs pass.\n\nIf it sits anyway: `gh workflow run ci.yml --ref %s` for missing checks, or check for runs still awaiting approval on the head sha.\n' "$BRANCH" "$BRANCH" > /tmp/pr-body.md
          # A bare `gh pr create` failure here reads as a GraphQL error with no
          # hint of the cause, which is how v0.8.1 lost its release PR after
          # everything else in the release had succeeded.
          if PR=$(gh pr create --base main --head "$BRANCH" --title "release: v${NEW_VERSION} — automated weekly batch" --body-file /tmp/pr-body.md 2>/tmp/pr-err); then
            gh pr merge --auto --squash "$PR"
            echo "Release PR: $PR"
            # Nothing else will start the required checks: a PR opened by
            # GITHUB_TOKEN raises no `pull_request` event, so auto-merge would
            # sit on three checks that never run. `workflow_dispatch` is the
            # one event GITHUB_TOKEN may trigger, and this job already holds
            # the `actions: write` it needs. Guarded so a re-run of an
            # already-tested branch does not queue a second identical run.
            HEAD_SHA=$(git rev-parse HEAD)
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --jq '.total_count')
            if [ "${RUNS:-0}" = "0" ]; then
              gh workflow run ci.yml --ref "$BRANCH"
              echo "Dispatched ci.yml on $BRANCH ($HEAD_SHA)"
            else
              echo "✅ $HEAD_SHA already has $RUNS check run(s)"
            fi

            # ── The third GITHUB_TOKEN wall, and the last one. ──
            # The `pull_request` runs this PR creates are held at
            # `action_required`: the repository requires approval from
            # first-time contributors, and `github-actions[bot]` is
            # PERMANENTLY one — it never authors a merged commit, so it can
            # never graduate. Those held runs leave check suites QUEUED on the
            # head sha forever, the status rollup never reaches a terminal
            # state, and auto-merge waits on it even though the required
            # contexts (test 20/22/24) are already green from the dispatched
            # run above. v0.9.0 sat here until a human clicked Approve.
            #
            # GITHUB_TOKEN may clear it: `actions: write` carries the approve
            # permission, measured 201 on a bot PR's own held run. It may not
            # approve a REVIEW, which is a different gate and still ours alone.
            #
            # Runs appear asynchronously, so poll. Approving an already-running
            # run answers 403 "not waiting for approval" — success, not failure.
            echo "Clearing held workflow runs on $HEAD_SHA"
            approved=0
            for attempt in 1 2 3 4 5 6; do
              HELD=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}" \
                --jq '[.workflow_runs[] | select(.status == "action_required" or .conclusion == "action_required") | .id] | .[]' 2>/dev/null || true)
              for id in $HELD; do
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null 2>&1; then
                  echo "  approved run $id"
                  approved=$((approved + 1))
                else
                  echo "  run $id needed no approval"
                fi
              done
              # Stop as soon as the picture is settled, rather than always
              # paying the full poll: nothing held after something was
              # approved means we are done, and nothing held by the third
              # look means the gate is not applying to this run at all.
              if [ -z "$HELD" ] && { [ "$approved" -gt 0 ] || [ "$attempt" -ge 3 ]; }; then
                break
              fi
              sleep 10
            done

            # Never leave this silent: a run still held here means auto-merge
            # will wait forever, which is the failure this whole block exists
            # to remove. Say so, and name what to click.
            STILL=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}" \
              --jq '[.workflow_runs[] | select(.status == "action_required" or .conclusion == "action_required") | .html_url] | .[]' 2>/dev/null || true)
            if [ -n "$STILL" ]; then
              echo "::error::Workflow runs are still held for approval, so auto-merge on $PR will wait forever. Approve them, or re-run this workflow: $STILL"
              exit 1
            fi
            echo "✅ no run is held for approval; auto-merge can complete"
          else
            cat /tmp/pr-err
            if grep -q 'not permitted to create or approve pull requests' /tmp/pr-err; then
              echo "::error::GITHUB_TOKEN may not open a pull request: \"GitHub Actions is not permitted to create or approve pull requests\". The branch is pushed and correct; only the PR is missing. Fix it once, in Settings -> Actions -> General -> Workflow permissions, by ticking \"Allow GitHub Actions to create and approve pull requests\" (equivalently: gh api -X PUT repos/$GITHUB_REPOSITORY/actions/permissions/workflow -F default_workflow_permissions=read -F can_approve_pull_request_reviews=true), then re-run this workflow. Until then, open it by hand: gh pr create --base main --head $BRANCH"
            else
              echo "::error::gh pr create failed for $BRANCH — see the output above."
            fi
            exit 1
          fi
